<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>临时施工区域冲突分析台</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>🚧 临时施工区域冲突分析台</h1>
    <p>导入带生效时间与资源占用的 GeoJSON 区域，自动检测同时段空间冲突与共享资源冲突，并给出错峰建议</p>
  </header>

  <main>
    <!-- 左侧面板 -->
    <aside id="panel">
      <section class="card">
        <h2>1. 导入区域</h2>
        <div class="row">
          <input type="file" id="fileInput" accept=".geojson,.json" />
          <button id="loadSampleBtn" type="button">加载示例</button>
        </div>
        <textarea id="geojsonInput" rows="6" placeholder='粘贴 GeoJSON（FeatureCollection），要素需含 properties: {name, layer, start, end, resources?}'></textarea>
        <div class="row">
          <button id="importBtn" class="primary" type="button">质量预检</button>
          <button id="clearBtn" class="danger" type="button">清空全部区域</button>
        </div>
        <p id="importMsg" class="msg"></p>
        <p class="hint">导入前先做质量预检：检查环闭合、顶点数量、自相交、时间与资源字段；确认规范化预览后才会写入区域库。</p>
      </section>

      <section class="card">
        <h2>2. 筛选与分析</h2>
        <div id="layerFilters" class="layers"><em>暂无图层</em></div>
        <div class="row">
          <label>分析时段起 <input type="date" id="rangeStart" /></label>
        </div>
        <div class="row">
          <label>分析时段止 <input type="date" id="rangeEnd" /></label>
        </div>
        <button id="analyzeBtn" class="primary" type="button">运行冲突分析</button>
      </section>

      <section class="card">
        <h2>3. 已导入区域 <span id="zoneCount" class="badge">0</span></h2>
        <ul id="zoneList" class="zone-list"></ul>
      </section>

      <section class="card">
        <h2>4. 已保存分析</h2>
        <div class="row">
          <input type="text" id="analysisName" placeholder="分析名称" />
          <button id="saveAnalysisBtn" type="button">保存当前分析</button>
        </div>
        <ul id="analysisList" class="analysis-list"></ul>
      </section>
    </aside>

    <!-- 右侧：地图 + 结果 -->
    <section id="content">
      <div id="map"></div>
      <section class="card" id="resultsCard">
        <h2>冲突结果 <span id="conflictSummary" class="badge">未运行</span></h2>
        <div class="row">
          <label>冲突类型筛选
            <select id="typeFilter">
              <option value="all">全部</option>
              <option value="spatial">空间冲突</option>
              <option value="resource">资源冲突</option>
              <option value="both">空间+资源冲突</option>
            </select>
          </label>
        </div>
        <div id="conflictList" class="conflict-list"><em>运行分析后在此展示，按重叠面积降序排列。</em></div>
      </section>
    </section>
  </main>

  <!-- 预检结果弹窗 -->
  <div id="precheckOverlay" class="overlay hidden">
    <div class="modal" id="precheckModal">
      <div class="modal-head">
        <h2>质量预检结果</h2>
        <button id="precheckCloseBtn" class="small" type="button">✕</button>
      </div>
      <div id="precheckSummary" class="precheck-summary"></div>
      <div class="row">
        <label class="small"><input type="checkbox" id="selectAllPass" checked /> 全选可导入项</label>
      </div>
      <ul id="precheckList" class="precheck-list"></ul>
      <div class="modal-foot row">
        <button id="confirmImportBtn" class="primary" type="button">导入选中的通过项</button>
        <button id="downloadNormalizedBtn" type="button">下载规范化 GeoJSON</button>
        <button id="cancelImportBtn" type="button">取消</button>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
